<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Campus Room Availability Checker</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #f3f5f9; color: #1d2433; }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: #5b6475; margin: 0 0 20px; }
  .card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); margin-bottom: 16px; }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  select, input { width: 100%; padding: 10px; font-size: 1rem; border: 1px solid #c9cfdb; border-radius: 8px; }
  .row { display: flex; gap: 12px; margin-top: 14px; }
  .row > div { flex: 1; }
  button { margin-top: 18px; width: 100%; padding: 12px; font-size: 1rem; border: 0; border-radius: 8px; background: #2f5bea; color: #fff; cursor: pointer; }
  .result { padding: 16px; border-radius: 10px; font-size: 1.25rem; font-weight: 700; text-align: center; }
  .ok { background: #e3f7e9; color: #146c2e; }
  .no { background: #fde7e7; color: #a11c1c; }
  .reason { font-size: .95rem; font-weight: 400; margin-top: 6px; }
  ul { padding-left: 18px; margin: 8px 0 0; }
  .tag { font-size: .8rem; background: #fde7e7; color: #a11c1c; padding: 2px 8px; border-radius: 99px; }
</style>
</head>
<body>
<main>
  <h1>Smart Campus Room Availability Checker</h1>
  <p class="sub">Check if a room is free for a time slot. Sample data only.</p>

  <div class="card">
    <label for="now">Current time</label>
    <input type="time" id="now" value="09:00">

    <label for="room" style="margin-top:14px">Room</label>
    <select id="room"></select>
    <label class="check" style="margin-top:12px;font-weight:400"><input type="checkbox" id="blocked" style="width:auto"> Room is blocked (e.g. maintenance)</label>
    <div id="roomInfo" style="margin-top:12px"></div>

    <div class="row">
      <div><label for="start">Start</label><input type="time" id="start" value="11:00"></div>
      <div><label for="end">End</label><input type="time" id="end" value="12:00"></div>
    </div>
    <button id="check">Check availability</button>
  </div>

  <div id="result"></div>
</main>

<script type="module" src="/src/main.js"></script>
</body>
</html>
