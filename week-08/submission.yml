# If you cannot run Python, fill the file by hand against the comments — a malformed
# file costs you nothing if the content is there.

schema: 1
week: "08"

student:
  name: Serdar Dundar
  student_id: 24B031016  # as in KBTU records, e.g. 00X000000
  github: Serdarishe    # your GitHub username, the one that owns the repo

assistant:
  tool: Claude (claude.ai web)  # the assistant you debugged with: ChatGPT, Claude, Claude Code, ...
  model: Claude Opus 5.5  # the exact model with its version, or: not displayed

skill:
  environment: claude-web  # chatgpt | claude-web | claude-code | prompt-only
  invoked: yes          # yes | no | not-shown   did the environment show that bug-detector was used?

project:
  language: js          # ts | js   the file you copied from buggy/
  vitest: 3.2.7         # the Vitest version from the "RUN  v..." line, e.g. 3.2.4

counts:
  tests_final: 25       # tests in your final suite (app/.../booking.test.*)
  buggy_failed: 8       # failed tests when your Week 07 suite ran on the provided canBook (lab-report.md 2.2)
  defects_logged: 2     # rows in lab-report.md section 3
  lines_changed: 2      # lines of the canBook body you changed to fix both bugs (the checker prints it under B3)

checker:
  # Numbers from YOUR last run of: python tests/check_debugging.py
  # They must add up to the number of checks it runs (31).
  # Report them as they came out.
  # A FAIL you report and explain in lab-report.md costs you nothing. A hidden one costs the criterion.
  pass: 31
  fail: 0
  error: 0
  commit: cc30796       # the commit you ran the checker at: git rev-parse --short HEAD
                       # (normally the commit just before you commit this file — that is fine)
  known_fails: []      # every check ID that is still FAIL or ERROR, explained in lab-report.md §9.1, e.g. [E1]

verdict:
  # Your judgement from lab-report.md section 7, against the actual code - not a guess.
  skill_helped: yes     # yes | no | no-difference

review_findings:
  # Three or more. One line each, and each one names what it is about: BUG-A, BUG-B, a test
  # (T01-T14, X1, X2, AC5), an AC, a step of the skill, or a file.
  # Worthless:        "The skill made the answer better"
  # Worth everything: "BUG-B: the AC5 test failed for the wrong reason until BUG-A was fixed - 660-720 was rejected before the push"
  - "BUG-B: my Week 07 AC5 test (660-720) failed for the wrong reason on the buggy code - BUG-A rejected it before bookings.push ran; after the BUG-A fix it failed on the data check"
  - "BUG-B: the no-skill answer's AC5 regression tests used 660-720, so on the buggy code BUG-A hid BUG-B; the skill answer used 700-760 (touches nothing), like my BUG-B test 720-780"
  - "skill step 4: the skill answer kept a separate 'Hypotheses (not confirmed)' part; its UI hypothesis was false - main.js only reads room.bookings"
  - "BUG-A: both answers proposed the same one-line fix, start < b.end && end > b.start; after it T01, T08, B6 and BUG-A pass and T09-T12 still reject overlaps"

honesty:
  buggy_function_pasted_unchanged: yes  # yes | no   you copied canBook from buggy/ exactly, before any fix
  same_input_both_chats: yes            # yes | no   sections 5 and 6 sent the same code, criteria and failure
  outputs_unedited: yes                 # yes | no   every run in lab-report.md is pasted from a real terminal
  ai_usage_disclosed: yes               # yes | no   AI_USAGE.md is complete
