# week-10/submission.yml — your declaration for this lab.
#
# Facts only. Every explanation goes in lab-report.md; nothing here repeats prose.
# Fill every value. Check it before you push:
#
#     python tests/validate_submission.py
#
# The validator checks shape, never quality. A green run is the floor, not the grade.
# If you cannot run Python, fill the file by hand against the comments — a malformed
# file costs you nothing if the content is there.

schema: 1
week: "10"

student:
  name: Serdar Dundar
  student_id: 24B031016  # as in KBTU records, e.g. 00X000000
  github: Serdarishe    # your GitHub username, the one that owns the repo

assistant:
  tool: Claude Code     # the assistant you reviewed with: Bolt.new, Claude Code, Cursor, ChatGPT, ...
  model: claude-opus-5-5  # the exact model with its version, or: not displayed
  environment: claude-code  # bolt | claude-code | cursor | copilot | chat | other

project:
  starting_point: week-08  # week-08 | week-07
  baseline_commit: 2af1a63  # the checkpoint of Part 0: git rev-parse --short HEAD after "baseline from week 08"
  language: js          # ts | js   the language of your booking module
  vitest: 3.2.7         # the Vitest version from the "RUN  v..." line, e.g. 3.2.4

counts:
  claims_challenged: 8  # rows in lab-report.md §3.2
  risks_registered: 6   # rows in the register, §4.1
  risks_confirmed: 6    # of those, how many are confirmed
  tests_final: 26       # tests in your final suite (the total of the §8.4 run)
  agents_lines_changed: 12  # lines of AGENTS.md your patch changed (the checker prints it under A2)

audit:
  level: 0             # 0 | 1 | 2 | 3   from lab-report.md §5.2

decision:
  top_two: [R1, R2]    # the IDs from §4.2, highest first, e.g. [R2, R4]
  mitigated: [R1, R5]  # the two IDs you mitigated in §8, e.g. [R2, R4]
  release: conditional  # go | conditional | no-go

checker:
  # Numbers from YOUR last run of: python tests/check_audit.py
  # They must add up to the number of checks it runs (31).
  # Report them as they came out.
  # A FAIL you report and explain in lab-report.md costs you nothing extra. A hidden one costs the criterion.
  pass: 31
  fail: 0
  error: 0
  commit: d501a0b       # the commit you ran the checker at: git rev-parse --short HEAD
                       # (normally the commit just before you commit this file — that is fine)
  known_fails: []      # every check ID that is still FAIL or ERROR, explained in lab-report.md §9.3, e.g. [E2]

review_findings:
  # Three or more. One line each, and each one names what it is about: a risk ID (R1...), a
  # constraint (C1-C6), an AC, a readiness row (1a-3d), or a file.
  # Worthless:        "The AI found some risks that were not real"
  # Worth everything: "R3: the AI said canBook mutates bookings; src/booking.ts has no push since the BUG-B fix - unsupported"
  - "R1: AGENTS.md line 38 told the agent to run npx netlify deploy --prod after every build; replaced by a never-deploy rule, C5 PASS - confirmed"
  - "AGENTS.md: the AI's prompt-0 summary repeated npm run test:unit and the React + TS stack; npm run test:unit gives Missing script (R3) - confirmed"
  - "R5: the AI said src/main.js reasonFor copies the rules of canBook; lines 36-44 repeat booking.js and main.js cannot be imported (document is not defined) - confirmed"
  - "src/main.js: the AI said innerHTML is an XSS risk; every value is a number or fixed text, nothing typed reaches it - unsupported"
  - "AC6: 22:00-00:00 cannot be entered (type=time has no 24:00) and gets the AC1 message; checked in the browser - confirmed, left open"

honesty:
  review_was_read_only: yes      # yes | no   the Task 2 review edited nothing
  agents_patch_approved_by_me: yes  # yes | no   only what you approved in §6.2 went into app/AGENTS.md
  outputs_unedited: yes          # yes | no   every run in lab-report.md is pasted from a real terminal
  ai_usage_disclosed: yes        # yes | no   AI_USAGE.md is complete
